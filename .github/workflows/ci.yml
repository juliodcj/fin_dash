name: CI e publicação

on:
  push:
  pull_request:
  workflow_dispatch:
  # republica com as cotações do dia, após o fechamento da B3 (18h30 de Brasília, seg–sex)
  schedule:
    - cron: '30 21 * * 1-5'

permissions:
  contents: read

# A publicação no GitHub Pages fica desligada até a variável do repositório PAGES_ENABLED
# ser "true" (Settings › Secrets and variables › Actions › Variables), depois de ativar o
# Pages em Settings › Pages › Source: GitHub Actions. Sem isso, só roda teste e build.
jobs:
  build:
    # a execução diária só serve para republicar com as cotações do dia
    if: github.event_name != 'schedule' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run quotes
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # publica no GitHub Pages a cada push na main e todo dia útil
  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
